<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaithHaven — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fdf9ec; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; color: #1e293b; }
    .container { text-align: center; max-width: 420px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 1rem; background: linear-gradient(135deg, #5b93d6, #8b7ac6); display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 40px; height: 40px; color: #fff; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    button { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 2rem; font-size: 1rem; font-weight: 600; color: #fff; background: #5b93d6; border: none; border-radius: 0.75rem; cursor: pointer; }
    button:hover { background: #4a7ec0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 11-12.728 0M12 2v4"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>FaithHaven needs an internet connection to load. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M20.49 9A9 9 0 005.64 5.64L4 4m16 16l-1.64-1.64A9 9 0 014.51 15"/></svg>
      Try Again
    </button>
  </div>
</body>
</html>
