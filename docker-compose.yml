services:
  faithhaven-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faithhaven-api
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env.production
    restart: unless-stopped

  faithhaven-web:
    build: .
    container_name: faithhaven-web
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - faithhaven-api
    restart: unless-stopped
