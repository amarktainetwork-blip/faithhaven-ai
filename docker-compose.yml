# Local development docker-compose (see docker-compose.prod.yml for production)
services:
  faithhaven-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faithhaven-api
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  faithhaven-web:
    build: .
    container_name: faithhaven-web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - faithhaven-api
    restart: unless-stopped
